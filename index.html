<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Tracker Icon</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #080e1b; color: #eef4ff;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { text-align: center; padding: 32px; }
    img { width: min(512px, 78vw); height: auto; border-radius: 24px; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { color: #aebbd3; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="Blue and black Budget Tracker app icon">
    <h1>Budget Tracker Icon</h1>
    <p>512 × 512 PNG · Blue and black palette</p>
  </main>
</body>
</html>
